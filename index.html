<body><title>Checklist Camionetas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: herramienta de terreno de una columna (máx. 640px), barra superior con estado de señal,
   pasos uno por pantalla y botonera fija abajo al alcance del pulgar. Ámbar de baliza como acento. */
:root {
  --bg: #EEF0EC;
  --surface: #FFFFFF;
  --sunk: #E3E7E1;
  --ink: #17202A;
  --muted: #586370;
  --line: #CDD3CC;
  --accent: #F2A900;
  --accent-ink: #1C1400;
  --ok: #1D7549;
  --ok-bg: #E1F1E7;
  --bad: #B3302A;
  --bad-bg: #FAE4E1;
  --warn: #8F5600;
  --warn-bg: #FFF0D2;
  --focus: #1F5FBF;
  --paper: #FFFFFF;
  --bar: #17202A;
  --bar-fg: #EEF0EC;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161B; --surface: #1A2128; --sunk: #232B33; --ink: #E8ECEF; --muted: #9AA4AE; --line: #2E3740;
    --accent: #F5B730; --accent-ink: #1C1400; --ok: #49C285; --ok-bg: #16301F; --bad: #F06A60; --bad-bg: #3A1B19;
    --warn: #F0B455; --warn-bg: #352812; --focus: #7FB0FF; --paper: #FFFFFF; --bar: #0B0F13; --bar-fg: #E8ECEF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161B; --surface: #1A2128; --sunk: #232B33; --ink: #E8ECEF; --muted: #9AA4AE; --line: #2E3740;
  --accent: #F5B730; --accent-ink: #1C1400; --ok: #49C285; --ok-bg: #16301F; --bad: #F06A60; --bad-bg: #3A1B19;
  --warn: #F0B455; --warn-bg: #352812; --focus: #7FB0FF; --paper: #FFFFFF; --bar: #0B0F13; --bar-fg: #E8ECEF; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 17px; line-height: 1.45; margin: 0; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; }

/* Barra superior */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); color: var(--bar-fg); }
.bar-in { display: flex; align-items: center; gap: 10px; min-height: 54px; }
.brand { all: unset; cursor: pointer; font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.brand { gap: 10px; }
.brand img { height: 30px; width: auto; display: block; }
.brand span { font-size: 15px; letter-spacing: .14em; color: var(--accent); padding-left: 10px; border-left: 1px solid color-mix(in srgb, var(--bar-fg) 30%, transparent); line-height: 22px; }
@media (max-width: 360px) { .brand img { height: 26px; } .brand span { display: none; } }

.hero { position: relative; overflow: hidden; margin-inline: -16px; padding: 8px 16px 6px; }
.hero > * { position: relative; }
.hero .gear { position: absolute; right: -54px; top: -38px; width: 210px; color: var(--ink); opacity: .07; pointer-events: none; }
.hero h1 { max-width: 11em; }
.foot { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 13px; letter-spacing: .04em; padding-top: 6px; }
.foot .gear { width: 16px; color: var(--muted); }
.done-gear { width: 56px; color: var(--accent); }
.bar-sp { flex: 1; }
.pill { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 99px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.net-on { background: color-mix(in srgb, var(--ok) 30%, transparent); color: #9BE3BC; }
.net-off { background: color-mix(in srgb, var(--accent) 28%, transparent); color: #FFD77A; }
.bar-x { all: unset; cursor: pointer; font-size: 14px; font-weight: 600; padding: 6px 10px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--bar-fg) 30%, transparent); }
.prog { padding-bottom: 10px; }
.prog-t { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; opacity: .85; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.prog-b { display: flex; gap: 3px; }
.prog-b span { flex: 1; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--bar-fg) 22%, transparent); }
.prog-b span.done { background: var(--accent); }
.prog-b span.cur { background: var(--bar-fg); }

main { padding-block: 18px 140px; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 32px; font-weight: 700; text-transform: uppercase; letter-spacing: .01em; }
h2 { font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
h3 { font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
p { margin: 0; }
.lead { color: var(--muted); }
.small { font-size: 14px; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.banner { border-radius: var(--r); padding: 12px 14px; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.banner b { font-weight: 600; }
.banner.info { background: var(--sunk); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }

/* Botones */
.btn { appearance: none; border: 0; border-radius: var(--r); min-height: 52px; padding: 0 18px; font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.dark { background: var(--ink); color: var(--bg); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; font-size: 16px; padding: 0 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }

/* Formularios */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-weight: 600; font-size: 15px; }
.field small { color: var(--muted); font-size: 13.5px; }
.input { width: 100%; min-height: 50px; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); font-size: 17px; }
textarea.input { min-height: 84px; resize: vertical; }
.invalid .input, .input.invalid { border-color: var(--bad); background: var(--bad-bg); }
.err-t { color: var(--bad); font-size: 14px; font-weight: 600; }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; cursor: pointer; }
.chk input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg.wrap { grid-auto-flow: row; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); }
.seg button { appearance: none; min-height: 50px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 16.5px; cursor: pointer; padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg button.v-ok[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.seg button.v-bad[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.seg button.v-na[aria-pressed="true"] { background: var(--muted); border-color: var(--muted); color: var(--bg); }

/* Patente estilo placa chilena */
.plate { display: inline-flex; flex-direction: column; align-items: center; background: var(--paper); color: #111; border: 2px solid #111; border-radius: 6px; padding: 1px 8px 2px; line-height: 1; flex: none; }
.plate small { font-family: var(--f-body); font-size: 7.5px; font-weight: 600; letter-spacing: .3em; padding-left: .3em; }
.plate b { font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.plate.lg b { font-size: 34px; }
.plate.lg small { font-size: 10px; }

/* Ítems del checklist */
.cat-h { display: flex; flex-direction: column; gap: 6px; }
.cat-tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.count { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); font-size: 15px; }
.items { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: var(--r); padding: 14px 14px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.item.is-ok { border-left-color: var(--ok); }
.item.is-bad { border-left-color: var(--bad); }
.item.is-na { border-left-color: var(--muted); }
.item.invalid { border-color: var(--bad); border-left-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.item-h { display: flex; gap: 10px; align-items: flex-start; }
.num { font-family: var(--f-display); font-weight: 700; font-size: 15px; color: var(--muted); min-width: 22px; padding-top: 2px; font-variant-numeric: tabular-nums; }
.q { flex: 1; min-width: 0; font-weight: 500; }
.tag { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; border-radius: 5px; flex: none; white-space: nowrap; }
.tag.crit { background: var(--bad-bg); color: var(--bad); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.na { background: var(--sunk); color: var(--muted); }
.aviso { font-size: 14px; font-weight: 600; }
.aviso.bad { color: var(--bad); } .aviso.warn { color: var(--warn); }
.fallo { display: flex; flex-direction: column; gap: 8px; padding-top: 2px; }

/* Fotos */
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.ph { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--sunk); max-width: 100%; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph button { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(0,0,0,.65); color: #fff; font-size: 18px; line-height: 1; cursor: pointer; }
.ph-add { aspect-ratio: 1; border-radius: 8px; border: 1.5px dashed var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; color: var(--muted); font-size: 13.5px; font-weight: 600; text-align: center; padding: 6px; }
.ph-add b { font-size: 26px; line-height: 1; font-weight: 500; }
.ph-add input, .photo-btn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.photo-btn { position: relative; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; color: var(--ink); cursor: pointer; padding: 8px 12px; border: 1.5px dashed var(--line); border-radius: 8px; align-self: flex-start; }
.thumb { width: 84px; height: 84px; }

/* Firma */
.sig-box { position: relative; background: var(--paper); border-radius: 8px; border: 1.5px solid var(--line); }
.sig-box canvas { display: block; width: 100%; height: 190px; touch-action: none; cursor: crosshair; border-radius: 8px; }
.sig-line { position: absolute; left: 16px; right: 16px; bottom: 40px; border-bottom: 1.5px solid #9AA3AB; pointer-events: none; }
.sig-hint { position: absolute; left: 16px; bottom: 14px; font-size: 13px; color: #6B747C; pointer-events: none; }
.sig-box.invalid { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.sig-img { background: var(--paper); border-radius: 8px; border: 1px solid var(--line); max-width: 100%; display: block; }

/* Resultado */
.res { border-radius: var(--r); padding: 18px 16px; display: flex; flex-direction: column; gap: 6px; }
.res .k { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
.res .v { font-family: var(--f-display); font-weight: 700; font-size: 38px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; }
.res.APTA { background: var(--ok); color: #fff; }
.res.OBS { background: var(--warn-bg); color: var(--warn); border: 1.5px solid currentColor; }
.res.NO { background: var(--bad); color: #fff; }
.flist { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.flist li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.flist li:first-child { border-top: 0; padding-top: 0; }
.flist .q { display: flex; flex-direction: column; gap: 2px; }
.flist .q small { color: var(--muted); font-size: 14px; }

/* Inicio */
.hero { display: flex; flex-direction: column; gap: 12px; padding-top: 4px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15.5px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.hist { display: flex; flex-direction: column; gap: 8px; }

/* RUT chileno: módulo 11 */
const rutClean = s => String(s || '').toUpperCase().replace(/[^0-9K]/g, '');
function rutValid(s) { const c = rutClean(s); if (c.length < 2) return false; const body = c.slice(0, -1), dv = c.slice(-1); if (!/^\d{6,8}$/.test(body)) return false; let sum = 0, m = 2; for (let i = body.length - 1; i >= 0; i--) { sum += +body[i] * m; m = m === 7 ? 2 : m + 1; } const r = 11 - (sum % 11); return (r === 11 ? '0' : r === 10 ? 'K' : String(r)) === dv; }
function rutFormat(s) { const c = rutClean(s); if (c.length < 2) return s; return c.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + c.slice(-1); }

/* ============ Almacenamiento en el teléfono (IndexedDB, con respaldo en memoria) ============ */
const Store = (() => {
  const mem = { kv: new Map(), queue: new Map() };
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise(res => {
      try {
        const r = indexedDB.open('checklist-camionetas', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('queue', { keyPath: 'id' }); };
        r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
      } catch (e) { res(null); }
    });
    return dbp;
  }
  async function run(st, mode, idbOp, memOp) {
    const d = await open();
    if (!d) return memOp(mem[st]);
    return new Promise(res => {
      try { const r = idbOp(d.transaction(st, mode).objectStore(st)); r.onsuccess = () => res(r.result); r.onerror = () => res(memOp(mem[st])); }
      catch (e) { res(memOp(mem[st])); }
    });
  }
  return {
    get: (st, k) => run(st, 'readonly', s => s.get(k), m => m.get(k)),
    put: (st, v, k) => run(st, 'readwrite', s => st === 'queue' ? s.put(v) : s.put(v, k), m => { m.set(st === 'queue' ? v.id : k, v); }),
    del: (st, k) => run(st, 'readwrite', s => s.delete(k), m => { m.delete(k); }),
    all: st => run(st, 'readonly', s => s.getAll(), m => [...m.values()])
  };
})();

/* ============ Reglas del checklist ============ */
function applicableItems(d) {
  if (d.items) return d.items; // registro guardado: usa la copia del catálogo del momento
  const hib = d.vehiculo.tipoMotor === 'HIBRIDO';
  return S.catalog.items.filter(i => yes(i.Activo) && (String(i.AplicaA || 'TODOS').toUpperCase() !== 'HIBRIDO' || hib)).sort((a, b) => a.Orden - b.Orden);
}
function categories(d) { const out = []; for (const i of applicableItems(d)) if (!out.includes(i.Categoria)) out.push(i.Categoria); return out; }
function steps(d) {
  return [{ k: 'conductor', t: 'Conductor' }, { k: 'vehiculo', t: 'Camioneta' }, ...categories(d).map(c => ({ k: 'cat', cat: c, t: catName(c) })), { k: 'extras', t: 'Fotos y observaciones' }, { k: 'firma', t: 'Resumen y firma' }];
}
function answerOpts(i) {
  switch (i.TipoRespuesta) {
    case 'SI/NO': return [['SI', 'Sí', 'v-ok'], ['NO', 'No', 'v-bad']];
    case 'SI/NO/N-A': return [['SI', 'Sí', 'v-ok'], ['NO', 'No', 'v-bad'], ['N-A', 'N/A', 'v-na']];
    case 'B/M/N-A': return [['B', 'Bueno', 'v-ok'], ['M', 'Malo', 'v-bad'], ['N-A', 'N/A', 'v-na']];
    case 'OPCION_UNICA': { const f = splitOpts(i.OpcionesFalla); return splitOpts(i.Opciones).map(o => [o, o, f.includes(o) ? 'v-bad' : '']); }
  }
  return [];
}
function evalItem(i, r) {
  if (!r || r.v == null || r.v === '') return { estado: 'PEND' };
  switch (i.TipoRespuesta) {
    case 'SI/NO': case 'SI/NO/N-A': return { estado: r.v === 'NO' ? 'FALLA' : r.v === 'N-A' ? 'NA' : 'OK' };
    case 'B/M/N-A': return { estado: r.v === 'M' ? 'FALLA' : r.v === 'N-A' ? 'NA' : 'OK' };
    case 'FECHA': {
      const n = daysUntil(r.v);
      if (n < 0) return { estado: 'FALLA', aviso: `Vencida hace ${-n} día${n === -1 ? '' : 's'}`, nivel: 'bad' };
      if (n <= 30) return { estado: 'OK', aviso: n === 0 ? 'Vence hoy' : `Vence en ${n} día${n === 1 ? '' : 's'}`, nivel: 'warn' };
      return { estado: 'OK' };
    }
    case 'OPCION_UNICA': return { estado: splitOpts(i.OpcionesFalla).includes(r.v) ? 'FALLA' : 'OK' };
  }
  return { estado: 'OK' };
}
function respTxt(i, r) {
  if (!r || r.v == null || r.v === '') return '';
  if (i.TipoRespuesta === 'FECHA') return fmtFecha(r.v);
  return ({ B: 'Bueno', M: 'Malo', 'N-A': 'N/A', SI: 'Sí', NO: 'No' })[r.v] || r.v;
}
function resultado(d) {
  const crit = [], fall = [];
  for (const i of applicableItems(d)) { if (evalItem(i, d.resp[i.Orden]).estado === 'FALLA') { fall.push(i); if (yes(i.Critico)) crit.push(i); } }
  return { r: crit.length ? 'NO APTA' : fall.length ? 'APTA CON OBSERVACIONES' : 'APTA', crit, fall };
}
const resClass = r => r === 'APTA' ? 'APTA' : r === 'NO APTA' ? 'NO' : 'OBS';
const resTag = r => r === 'APTA' ? 'ok' : r === 'NO APTA' ? 'crit' : 'warn';
function recipients(d, r) {
  const faena = (d.vehiculo.faena || '').trim().toLowerCase();
  return S.catalog.responsables.filter(x => yes(x.Activo) && x.Correo && (String(x.Faena).toUpperCase() === 'TODAS' || String(x.Faena).trim().toLowerCase() === faena)
    && ((r === 'NO APTA' && yes(x.AvisarNoApta)) || (r === 'APTA CON OBSERVACIONES' && yes(x.AvisarObservaciones))));
}
function faenas() {
  const set = new Set();
  S.catalog.vehiculos.forEach(v => v.Faena && set.add(String(v.Faena)));
  S.catalog.responsables.forEach(r => r.Faena && String(r.Faena).toUpperCase() !== 'TODAS' && set.add(String(r.Faena)));
  return [...set].sort();
}
function fleetFind(p) { const n = normPat(p); return n ? S.catalog.vehiculos.find(v => yes(v.Activo ?? 'Si') && normPat(v.Patente) === n) : null; }

/* Validación de cada paso: devuelve lista de errores */
function validate(st, d) {
  const e = [];
  if (st.k === 'conductor') {
    const c = d.conductor;
    if (c.nombre.trim().length < 3) e.push({ f: 'nombre', m: 'Escriba su nombre completo' });
    if (!rutValid(c.rut)) e.push({ f: 'rut', m: 'RUT no válido. Revise el dígito verificador' });
    if (!c.area.trim()) e.push({ f: 'area', m: 'Indique la faena o contrato' });
    if (!c.turno) e.push({ f: 'turno', m: 'Seleccione el turno' });
  } else if (st.k === 'vehiculo') {
    const v = d.vehiculo;
    if (normPat(v.patente).length < 5) e.push({ f: 'patente', m: 'Ingrese la patente' });
    if (!v.tipoMotor) e.push({ f: 'tipoMotor', m: 'Seleccione el tipo de motor' });
    if (!v.faena.trim()) e.push({ f: 'faena', m: 'Escriba o elija la faena' });
    if (!/^\d{1,7}$/.test(String(v.km).replace(/\./g, ''))) e.push({ f: 'km', m: 'Ingrese el kilometraje (solo números)' });
  } else if (st.k === 'cat') {
    for (const i of applicableItems(d).filter(i => i.Categoria === st.cat)) {
      const r = d.resp[i.Orden], ev = evalItem(i, r);
      if (ev.estado === 'PEND') e.push({ o: i.Orden, m: 'Sin responder' });
      else if (ev.estado === 'FALLA' && yes(i.ObsObligatoria) && !(r.obs || '').trim()) e.push({ o: i.Orden, m: 'Describa la falla' });
    }
  } else if (st.k === 'firma') {
    if (!d.declara) e.push({ f: 'declara', m: 'Confirme la declaración' });
    if (!d.firma) e.push({ f: 'firma', m: 'Falta su firma' });
    acompList(d).forEach((a, k) => {
      if ((a.nombre || '').trim().length < 3) e.push({ f: `a${k}-nombre`, m: 'Escriba el nombre completo del acompañante' });
      if (!rutValid(a.rut)) e.push({ f: `a${k}-rut`, m: 'RUT no válido. Revise el dígito verificador' });
      if (!a.firma) e.push({ f: `a${k}-firma`, m: 'Falta la firma del acompañante' });
    });
  }
  return e;
}

function homeHTML() {
  const recs = [...S.queue].sort((a, b) => b.savedAt - a.savedAt).slice(0, 30);
  const pend = S.queue.filter(r => r.status === 'pendiente').length;
  let h = `<section class="hero"><span class="gear" aria-hidden="true"></span><h1>Checklist de camioneta</h1><p class="lead">Revise la camioneta antes de conducir. Funciona sin señal: lo que guarde se envía solo cuando vuelva la conexión.</p></section>`;
  if (DEMO) h += `<div class="banner info"><b>Modo demostración</b><span>Los checklists se guardan solo en este teléfono y no se envían correos. Al conectar la app con SharePoint, se envían al Excel de la empresa y se avisa al responsable.</span></div>`;
  else if (!Auth.account && S.authBlocked) h += `<div class="banner bad"><b>La app todavía no está autorizada en la empresa</b><span>Microsoft indicó que un administrador de TI debe aprobar la app "Checklist camionetas". Mientras tanto, los checklists quedan guardados en este teléfono y se enviarán cuando esté aprobada y usted inicie sesión.</span><button class="btn sm dark" data-a="login" ${S.online ? '' : 'disabled'}>Reintentar inicio de sesión</button></div>`;
  else if (!Auth.account) h += `<div class="card"><p><b>Inicie sesión con su cuenta de la empresa</b></p><p class="small">Se hace una sola vez y necesita señal. Después la app funciona sin conexión.</p><button class="btn dark" data-a="login" ${S.online ? '' : 'disabled'}>Iniciar sesión con Microsoft</button></div>`;
  else if (S.needsLogin) h += `<div class="banner warn"><b>Su sesión de Microsoft expiró</b><span>Los checklists siguen guardados en el teléfono. Inicie sesión para enviarlos.</span><button class="btn sm dark" data-a="login" ${S.online ? '' : 'disabled'}>Iniciar sesión</button></div>`;

  if (!EMBED && !STANDALONE) {
    if (S.installEvt) h += `<div class="card"><p><b>Instale la app en este teléfono</b></p><p class="small">Queda como un ícono en la pantalla de inicio y abre sin señal.</p><button class="btn dark" data-a="install">Instalar app</button></div>`;
    else if (IOS) h += `<div class="banner info"><b>Instale la app en este iPhone</b><span>Toque el botón Compartir de Safari (cuadrado con flecha) y luego "Agregar a inicio".</span></div>`;
  }
  if (S.draft) {
    const all = steps(S.draft);
    h += `<div class="card"><div class="stat">${plate(S.draft.vehiculo.patente)}<div class="t"><b>Checklist sin terminar</b><p class="small">Quedó en el paso ${S.step + 1} de ${all.length}: ${esc(all[S.step].t)}</p></div></div>`;
    h += `<button class="btn primary block" data-a="resume">Continuar checklist</button>`;
    h += S.confirmDiscard
      ? `<div class="row"><button class="btn danger sm" data-a="discard-yes">Sí, descartar</button><button class="btn ghost sm" data-a="discard-no">Cancelar</button></div>`
      : `<button class="btn ghost sm" data-a="discard">Descartar y empezar otro</button>`;
    h += `</div>`;
  } else {
    h += `<button class="btn primary block" data-a="new" style="min-height:64px;font-size:22px">Nuevo checklist</button>`;
  }

  if (!DEMO && S.queue.length) {
    h += `<div class="card"><div class="stat"><span class="n">${pend}</span><div class="t"><b>${pend === 1 ? 'Checklist por enviar' : 'Checklists por enviar'}</b><p class="small">${!pend ? 'Todo enviado a SharePoint.'
      : !Auth.account ? (S.authBlocked ? 'No se pueden enviar: falta que TI apruebe la app. Quedan guardados en el teléfono.' : 'No se pueden enviar: falta iniciar sesión con Microsoft (botón de arriba). Quedan guardados en el teléfono.')
      : S.needsLogin ? 'No se pueden enviar: inicie sesión de nuevo (botón de arriba).'
      : !S.online ? 'Se enviarán cuando haya señal.'
      : S.syncing ? 'Enviando…' : S.syncMsg ? 'Se reintentará en unos minutos.' : 'Se enviarán en unos segundos.'}${S.lastSync ? ' Último envío: ' + fmtCorto(S.lastSync) + '.' : ''}</p></div></div>`;
    if (S.syncMsg) h += `<p class="err-t">${esc(S.syncMsg)}</p>`;
    if (pend && Auth.account) h += `<button class="btn ghost sm" data-a="sync" ${S.online && !S.syncing ? '' : 'disabled'}>Enviar ahora</button>`;
    h += `</div>`;
  }

  h += `<h3>Últimos checklists en este teléfono</h3>`;
  if (!recs.length) h += `<div class="empty">Aquí aparecerán los checklists que guarde, con su resultado y si ya se enviaron.</div>`;
  else h += `<div class="hist">${recs.map(r => {
    const s = r.status === 'enviado' ? `<span class="sync">Enviado</span>` : r.status === 'local' ? `<span class="sync">En el teléfono</span>` : `<span class="sync p">Por enviar</span>`;
    return `<button class="h-row" data-a="open" data-id="${esc(r.id)}">${plate(r.vehiculo.patente)}<span class="h-mid"><b>${esc(r.conductor.nombre)}</b><span>${fmtCorto(r.savedAt)} · ${esc(r.vehiculo.faena)}${r.example ? ' · <span class="ex">Ejemplo</span>' : ''}</span></span><span class="h-end"><span class="tag ${resTag(r.res)}">${esc(r.res === 'APTA CON OBSERVACIONES' ? 'Con obs.' : r.res)}</span>${s}</span></button>`;
  }).join('')}</div>`;

  const src = S.catalog.source === 'sharepoint' ? `SharePoint, actualizado ${fmtCorto(S.catalog.updatedAt)}` : 'integrado en la app';
  h += `<div class="card"><h3>Datos de la app</h3><dl class="kv"><dt>Ítems activos</dt><dd>${S.catalog.items.filter(i => yes(i.Activo)).length}</dd><dt>Camionetas</dt><dd>${S.catalog.vehiculos.length}</dd><dt>Catálogo</dt><dd>${esc(src)}</dd>${!DEMO && Auth.account ? `<dt>Cuenta</dt><dd>${esc(Auth.account.username)}</dd>` : ''}</dl><div class="row">`;
  if (!DEMO && Auth.account) h += `<button class="btn ghost sm" data-a="refresh" ${S.online ? '' : 'disabled'}>Actualizar catálogo</button>`;
  if (!EMBED && S.queue.length) h += `<button class="btn ghost sm" data-a="export">Exportar a Excel</button>`;
  h += `</div></div>`;
  h += `<footer class="foot"><span class="gear" aria-hidden="true"></span>Metal Torque · Checklist pre-uso de camionetas</footer>`;
  return h;
}

function errOf(f) { return S.showErr ? validate(steps(S.draft)[S.step], S.draft).find(e => e.f === f) : null; }
function fieldHTML(f, label, inner, hint) {
  const e = errOf(f);
  return `<label class="field${e ? ' invalid' : ''}"><span>${label}</span>${inner}${e ? `<span class="err-t">${esc(e.m)}</span>` : hint ? `<small>${hint}</small>` : ''}</label>`;
}
function segHTML(path, val, opts, f) {
  const e = errOf(f);
  return `<div class="field${e ? ' invalid' : ''}"><div class="seg" role="group">${opts.map(([v, t]) => `<button type="button" data-a="setf" data-f="${path}" data-v="${esc(v)}" aria-pressed="${val === v}">${esc(t)}</button>`).join('')}</div>${e ? `<span class="err-t">${esc(e.m)}</span>` : ''}</div>`;
}

function stepHTML(st) {
  const d = S.draft;

    const c = d.conductor;
    return `<h2>Sus datos</h2>
      ${fieldHTML('nombre', 'Nombre completo', `<input class="input" id="f-nombre" data-f="conductor.nombre" autocomplete="name" value="${esc(c.nombre)}">`)}

      ${fieldHTML('area', 'Faena o contrato', `<input class="input" id="f-area" data-f="conductor.area" placeholder="Ej.: Contrato 9100078704" value="${esc(c.area)}">`)}
      <div class="field"><span style="font-weight:600;font-size:15px">Turno</span>${segHTML('conductor.turno', c.turno, [['Día', 'Día'], ['Noche', 'Noche']], 'turno')}</div>
      <label class="chk"><input type="checkbox" id="f-recordar" data-f="recordar" ${d.recordar ? 'checked' : ''}><span>Recordar mis datos en este teléfono para el próximo checklist</span></label>`;

    let hint = 'Formato: ABCD12 o AB1234';
    if (found) hint = 'Camioneta encontrada en la flota. Revise los datos.';
    else if (np.length >= 6 && !fmtOk) hint = 'Esta patente no tiene el formato habitual. Revísela.';
    else if (np.length >= 6) hint = 'No está en la lista de la flota. Complete los datos a mano.';
    const fs = faenas(); if (v.faena && !fs.includes(v.faena)) fs.push(v.faena);
    return `<h2>Camioneta</h2>
      <div class="card" style="align-items:center">${plate(v.patente, true)}</div>
      ${fieldHTML('patente', 'Patente', `<input class="input" id="f-patente" data-f="vehiculo.patente" list="dl-pat" autocapitalize="characters" autocomplete="off" value="${esc(v.patente)}"><datalist id="dl-pat">${S.catalog.vehiculos.map(x => `<option value="${esc(normPat(x.Patente))}">${esc(x.NInterno + ' · ' + x.MarcaModelo)}</option>`).join('')}</datalist>`, hint)}

        ${fieldHTML('nInterno', 'N° interno', `<input class="input" id="f-ninterno" data-f="vehiculo.nInterno" value="${esc(v.nInterno)}">`)}
        ${fieldHTML('km', 'Kilometraje', `<input class="input" id="f-km" data-f="vehiculo.km" inputmode="numeric" placeholder="Ej.: 84500" value="${esc(v.km)}">`)}

      ${fieldHTML('faena', 'Faena', `<input class="input" id="f-faena" data-f="vehiculo.faena" list="dl-faena" autocomplete="off" placeholder="Escriba o elija una faena" value="${esc(v.faena)}"><datalist id="dl-faena">${fs.map(f => `<option value="${esc(f)}"></option>`).join('')}</datalist>`, 'Puede escribir el nombre o elegir uno de la lista')}

/* ============ Firma ============ */
// Cada firma se identifica con una clave: 'c' = conductor, 'a0', 'a1'… = acompañantes
const getSig = key => key === 'c' ? S.draft.firma : (S.draft.acompanantes[+key.slice(1)] || {}).firma;
function setSig(key, url) { if (key === 'c') S.draft.firma = url; else { const a = S.draft.acompanantes[+key.slice(1)]; if (a) a.firma = url; } }
function sigFieldHTML(key, label, has, err) {
  return `<div class="field"><span style="font-weight:600;font-size:15px">${esc(label)}</span>
    <div class="sig-box${err ? ' invalid' : ''}" id="sig-box-${key}"><canvas data-sig="${key}" aria-label="Área para firmar con el dedo"></canvas><div class="sig-line"></div><div class="sig-hint" id="sig-hint-${key}">${has ? '' : 'Firme aquí con el dedo'}</div></div>
    ${err ? `<span class="err-t">${esc(err.m)}</span>` : ''}<button class="btn ghost sm" data-a="sigclear" data-sig="${key}" style="align-self:flex-start">Borrar firma</button></div>`;
}
function mountSigs() { document.querySelectorAll('canvas[data-sig]').forEach(mountSig); }
function mountSig(c) {
  const key = c.dataset.sig;
  const dpr = Math.max(1, window.devicePixelRatio || 1), w = c.clientWidth, h = c.clientHeight;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  g.lineWidth = 2.6; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#13296A'; g.fillStyle = '#13296A';
  const saved = getSig(key);
  if (saved) { const im = new Image(); im.onload = () => g.drawImage(im, 0, 0, w, h); im.src = saved; }
  let drawing = false, last = null;
  const pt = e => { const b = c.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  c.onpointerdown = e => { e.preventDefault(); drawing = true; try { c.setPointerCapture(e.pointerId); } catch (_) { } last = pt(e); g.beginPath(); g.arc(last.x, last.y, 1.3, 0, Math.PI * 2); g.fill(); $('#sig-hint-' + key).textContent = ''; };
  c.onpointermove = e => { if (!drawing) return; const p = pt(e); g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke(); last = p; };
  const end = () => {
    if (!drawing) return; drawing = false;
    const o = document.createElement('canvas'); o.width = c.width; o.height = c.height;
    const og = o.getContext('2d'); og.fillStyle = '#FFFFFF'; og.fillRect(0, 0, o.width, o.height); og.drawImage(c, 0, 0);
    setSig(key, o.toDataURL('image/png')); saveDraftSoon();
    $('#sig-box-' + key).classList.remove('invalid'); renderNavMsg();
  };
  c.onpointerup = end; c.onpointercancel = end; c.onpointerleave = end;
}
const acompList = r => r.tieneAcomp ? (r.acompanantes || []) : [];

/* ============ Fotos ============ */
async function readPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('No se pudo leer la foto')); i.src = url; });
    const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.72);
  } finally { URL.revokeObjectURL(url); }
}

/* ============ Flujo del checklist ============ */
function newDraft() {
  const h = new Date().getHours(), pr = S.profile;
  const d = {
    id: genId(), startedAt: Date.now(), recordar: true,
    conductor: pr ? { ...pr, turno: h >= 7 && h < 19 ? 'Día' : 'Noche' } : { nombre: '', rut: '', area: '', turno: h >= 7 && h < 19 ? 'Día' : 'Noche' },
    vehiculo: { patente: '', nInterno: '', marcaModelo: '', tipoMotor: '', faena: '', km: '' },
    resp: {}, extras: { obs: '', fotos: [] }, firma: null, declara: false, geo: null, step: 0,
    tieneAcomp: false, acompanantes: []
  };
  try { navigator.geolocation.getCurrentPosition(p => { if (S.draft === d) { d.geo = { lat: p.coords.latitude, lon: p.coords.longitude }; saveDraftSoon(); } }, () => { }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 120000 }); } catch (e) { }
  return d;
}
function setPath(obj, path, val) { const ks = path.split('.'); let o = obj; for (let k = 0; k < ks.length - 1; k++) o = o[ks[k]]; o[ks[ks.length - 1]] = val; }
function goStep(n) { S.step = n; S.draft.step = n; S.showErr = false; saveDraftSoon(); render(); window.scrollTo(0, 0); }

async function saveChecklist() {
  const d = S.draft, items = applicableItems(d);
  const rec = JSON.parse(JSON.stringify(d));
  rec.items = items; rec.savedAt = Date.now(); rec.res = resultado(rec).r;
  rec.status = DEMO ? 'local' : 'pendiente'; rec.sync = {};
  delete rec.step;
  await Store.put('queue', rec);
  if (d.recordar) { S.profile = { nombre: d.conductor.nombre, rut: d.conductor.rut, area: d.conductor.area }; await Store.put('kv', S.profile, 'profile'); }
  else { S.profile = null; await Store.del('kv', 'profile'); }
  await Store.del('kv', 'draft'); clearTimeout(draftTimer);
  S.draft = null; S.queue = await Store.all('queue'); S.savedId = rec.id; S.view = 'done';
  render(); window.scrollTo(0, 0);
  syncAll();
}

/* ============ Eventos ============ */
const actions = {
  home() { S.view = 'home'; S.confirmDiscard = false; render(); window.scrollTo(0, 0); },
  new() { S.draft = newDraft(); S.step = 0; S.view = 'wizard'; S.showErr = false; saveDraftSoon(); render(); window.scrollTo(0, 0); },
  resume() { S.view = 'wizard'; render(); window.scrollTo(0, 0); },
  exit() { if (S.draft) Store.put('kv', S.draft, 'draft'); S.view = 'home'; render(); window.scrollTo(0, 0); toast('Checklist guardado como borrador'); },
  discard() { S.confirmDiscard = true; render(); },

const Auth = {

  init() {
    if (DEMO) return Promise.resolve();

        const m = `${e.errorCode || ''} ${e.errorMessage || e.message || ''}`;
        // AADSTS65001/90094/90095 o access_denied: el inquilino exige aprobación de un administrador
        if (/AADSTS(65001|90094|90095)|consent|access_denied/i.test(m)) { S.authBlocked = true; Store.put('kv', true, 'authBlocked'); }

  async token() {

    try { return (await this.pca.acquireTokenSilent({ scopes: SCOPES, account: this.account })).accessToken; }
    catch (e) { throw Object.assign(new Error('La sesión de Microsoft expiró'), { auth: true }); }

};
async function graph(path, { method = 'GET', body, headers = {} } = {}) {
  const tok = await Auth.token();
  const isBlob = body instanceof Blob;
  const r = await fetch(GRAPH + path, { method, headers: { Authorization: 'Bearer ' + tok, ...(body && !isBlob ? { 'Content-Type': 'application/json' } : {}), ...headers }, body: isBlob ? body : body ? JSON.stringify(body) : undefined });
  if (!r.ok) { let m = ''; try { m = (await r.json()).error.message; } catch (_) { } throw Object.assign(new Error(`Microsoft 365 respondió ${r.status}${m ? ': ' + m : ''}`), { status: r.status, auth: r.status === 401 }); }
  if (r.status === 202 || r.status === 204) return null;
  return r.json();
}

function dataUrlBlob(u) { const [h, b] = u.split(','); const mime = h.match(/:(.*?);/)[1]; const bin = atob(b); const a = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) a[k] = bin.charCodeAt(k); return new Blob([a], { type: mime }); }

async function syncAll(manual) {
  if (DEMO || S.syncing || !navigator.onLine) return;

  try {
    await Auth.init();
    if (!Auth.account) { S.needsLogin = false; return; }
    const pend = (await Store.all('queue')).filter(r => r.status === 'pendiente').sort((a, b) => a.savedAt - b.savedAt);
    for (const r of pend) {

      }
    }
    if (pend.length && !S.syncMsg && !S.needsLogin && manual !== undefined) toast('Checklists enviados a SharePoint');
  } catch (e) { S.syncMsg = 'No se pudo conectar con Microsoft 365. Se reintentará.'; }

    S.syncing = false; S.queue = await Store.all('queue');
    if (S.view === 'home' || S.view === 'done' || S.view === 'detail') render(); else renderBar();
    clearTimeout(syncTimer);

  }
}
